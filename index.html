<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>我的音乐播放器</title>
<style>
  :root {
    --primary: #6366f1;
    --primary-light: #818cf8;
    --text-dark: #1e293b;
    --text-light: #64748b;
    --glass-bg: rgba(255, 255, 255, 0.7);
    --glass-border: rgba(255, 255, 255, 0.9);
    --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
    --danger: #ef4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
    background-attachment: fixed;
    color: var(--text-dark);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .app-container {
    width: 100%;
    max-width: 1100px;
    height: 88vh;
    min-height: 650px;
    display: flex;
    gap: 24px;
    position: relative;
  }

  .glass-panel {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    box-shadow: var(--glass-shadow);
  }

  /* ================= 左侧播放器 ================= */
  .player-panel {
    flex: 0 0 380px;
    display: flex;
    flex-direction: column;
    padding: 30px;
    position: relative;
    overflow: hidden;
  }

  .cover-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
  }

  .disc {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
    display: grid;
    place-items: center;
    box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2), inset 0 0 0 10px rgba(255,255,255,0.5);
    position: relative;
    transition: transform 0.3s;
  }
  .disc.playing { animation: spin 15s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .disc::after { content: '♪'; font-size: 40px; color: var(--primary); font-weight: bold; }

  .song-info { text-align: center; width: 100%; padding: 0 10px; }
  .song-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-artist { font-size: 13px; color: var(--text-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 进度条 */
  .progress-area { width: 100%; margin-top: 20px; }
  .time-wrap { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-light); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  
  input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; cursor: pointer; }
  input[type=range]:focus { outline: none; }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: rgba(0,0,0,0.08); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
    background: #fff; border: 3px solid var(--primary); margin-top: -5px;
    box-shadow: 0 2px 6px rgba(99,102,241,0.4); transition: transform 0.1s;
  }
  input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
  #progress::-webkit-slider-runnable-track { background: linear-gradient(to right, var(--primary) var(--p,0%), rgba(0,0,0,0.08) var(--p,0%)); }

  /* 控制按钮 */
  .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
  .btn-icon {
    background: none; border: none; font-size: 20px; color: var(--text-light);
    cursor: pointer; width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center; transition: all 0.2s;
  }
  .btn-icon:hover { background: rgba(255,255,255,0.6); color: var(--primary); }
  .btn-icon.active { color: var(--primary); background: rgba(255,255,255,0.5); }
  .btn-play {
    width: 64px; height: 64px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: white; font-size: 24px; cursor: pointer;
    box-shadow: 0 8px 20px rgba(99,102,241,0.4);
    display: grid; place-items: center; transition: transform 0.1s;
  }
  .btn-play:active { transform: scale(0.95); }

  .tag-loop-bar {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 15px; font-size: 13px; color: var(--text-light);
    background: rgba(255,255,255,0.4); padding: 8px; border-radius: 12px; cursor: pointer;
  }
  .tag-loop-bar input { cursor: pointer; accent-color: var(--primary); }

  /* ================= 右侧列表 ================= */
  .list-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 24px;
    overflow: hidden;
    position: relative;
  }

  /* 标签栏 */
  .tag-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 15px;
    overflow-x: auto; padding-bottom: 5px;
  }
  .tag-header::-webkit-scrollbar { display: none; }
  .tag-btn {
    background: rgba(255,255,255,0.5); border: 1px solid transparent;
    padding: 6px 14px; border-radius: 20px; font-size: 13px; color: var(--text-light);
    cursor: pointer; white-space: nowrap; transition: all 0.2s;
  }
  .tag-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 10px rgba(99,102,241,0.3); }
  .tag-btn.add-btn { background: transparent; border: 1px dashed var(--text-light); }
  .tag-btn.add-btn:hover { color: var(--primary); border-color: var(--primary); }

  .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .list-header h2 { font-size: 18px; font-weight: 700; }
  .list-header span { font-size: 13px; color: var(--text-light); font-weight: normal; }

  .playlist { list-style: none; overflow-y: auto; flex: 1; padding-right: 8px; }
  .playlist::-webkit-scrollbar { width: 6px; }
  .playlist::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 3px; }

  .track-item {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 16px; border-radius: 16px; cursor: pointer;
    transition: all 0.2s; margin-bottom: 8px;
    border: 1px solid transparent; position: relative;
  }
  .track-item:hover { background: rgba(255,255,255,0.5); }
  .track-item.active { background: rgba(255,255,255,0.85); border-color: var(--glass-border); box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
  
  .track-icon {
    width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
    background: rgba(0,0,0,0.05); color: var(--text-light); transition: all 0.2s;
  }
  .track-item.active .track-icon { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; }

  .track-info { flex: 1; min-width: 0; }
  .track-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-path { font-size: 11px; color: var(--text-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  
  .track-tags { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .mini-tag { font-size: 10px; background: #e0e7ff; color: var(--primary); padding: 2px 6px; border-radius: 4px; }

  .playing-indicator { display: none; gap: 3px; align-items: flex-end; height: 14px; margin-right: 10px; }
  .track-item.active .playing-indicator { display: flex; }
  .track-item.active .playing-indicator i {
    display: block; width: 3px; background: var(--primary); border-radius: 2px;
    animation: eq 1s infinite ease-in-out;
  }
  .playing-indicator i:nth-child(1) { height: 60%; animation-delay: 0s; }
  .playing-indicator i:nth-child(2) { height: 100%; animation-delay: -0.2s; }
  .playing-indicator i:nth-child(3) { height: 40%; animation-delay: -0.4s; }
  @keyframes eq { 0%, 100% { transform: scaleY(0.5); } 50% { transform: scaleY(1); } }

  /* 更多操作按钮 */
  .more-btn {
    background: none; border: none; font-size: 18px; color: var(--text-light);
    cursor: pointer; padding: 8px; border-radius: 8px; transition: 0.2s;
  }
  .more-btn:hover { background: rgba(0,0,0,0.05); color: var(--primary); }

  /* 上下文菜单 */
  .context-menu {
    position: absolute; background: #fff; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15); padding: 8px 0;
    min-width: 160px; z-index: 100; display: none; border: 1px solid #f1f5f9;
  }
  .context-menu.show { display: block; }
  .menu-item {
    padding: 10px 16px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 10px;
  }
  .menu-item:hover { background: #f8fafc; color: var(--primary); }
  .menu-item.danger:hover { background: #fef2f2; color: var(--danger); }

  .status-msg { text-align: center; color: var(--text-light); margin-top: 20px; font-size: 14px; }

  /* 标签弹窗 */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(4px);
    display: none; justify-content: center; align-items: center; z-index: 1000;
  }
  .modal-overlay.show { display: flex; }
  .modal-content {
    background: #fff; padding: 24px; border-radius: 20px; width: 90%; max-width: 320px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2); text-align: center;
  }
  .modal-content h3 { margin-bottom: 15px; font-size: 18px; }
  .modal-content input {
    width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;
    margin-bottom: 20px; font-size: 14px; outline: none;
  }
  .modal-content input:focus { border-color: var(--primary); }
  .modal-btns { display: flex; gap: 10px; justify-content: center; }
  .modal-btns button {
    padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px;
  }
  .btn-cancel { background: #f1f5f9; color: var(--text-dark); }
  .btn-confirm { background: var(--primary); color: white; }

  /* 移动端适配 */
  @media (max-width: 768px) {
    body { padding: 0; height: 100dvh; overflow: hidden; }
    .app-container { flex-direction: column; height: 100%; max-width: 100%; gap: 0; }
    .glass-panel { border-radius: 0; border: none; background: transparent; backdrop-filter: none; box-shadow: none; }
    
    .player-panel {
      flex: 0 0 auto; padding: 15px 20px 5px;
      background: var(--glass-bg); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--glass-border); z-index: 10;
    }
    .disc { width: 100px; height: 100px; font-size: 20px; }
    .disc::after { font-size: 24px; }
    .song-title { font-size: 16px; }
    .controls { margin-top: 10px; }
    .btn-play { width: 50px; height: 50px; font-size: 20px; }
    .progress-area { margin-top: 10px; }
    .tag-loop-bar { padding: 4px; margin-top: 8px; font-size: 11px; }

    .list-panel { flex: 1; background: rgba(255,255,255,0.4); padding: 15px 10px; border-radius: 20px 20px 0 0; }
    .tag-header { margin-bottom: 10px; }
    .track-item { padding: 10px; margin-bottom: 4px; gap: 10px; }
    .track-icon { width: 32px; height: 32px; font-size: 10px; }
    .track-name { font-size: 14px; }
  }
</style>
</head>
<body>

<div class="app-container">
  
  <!-- 播放器面板 -->
  <div class="player-panel glass-panel">
    <div class="cover-area">
      <div class="disc" id="disc"></div>
      <div class="song-info">
        <div class="song-title" id="songTitle">等待读取...</div>
        <div class="song-artist" id="songArtist">请确保仓库为公开状态</div>
      </div>
    </div>

    <div class="progress-area">
      <div class="time-wrap">
        <span id="curTime">0:00</span>
        <span id="durTime">0:00</span>
      </div>
      <input type="range" id="progress" min="0" max="1000" value="0" disabled>
    </div>

    <div class="controls">
      <button class="btn-icon active" id="modeBtn" title="列表循环">🔁</button>
      <button class="btn-icon" id="prevBtn">⏮</button>
      <button class="btn-play" id="playBtn">▶</button>
      <button class="btn-icon" id="nextBtn">⏭</button>
      <button class="btn-icon" id="shuffleBtn" title="随机播放">🔀</button>
    </div>

    <label class="tag-loop-bar">
      <input type="checkbox" id="tagLoopToggle"> 
      只在当前标签内循环播放
    </label>
  </div>

  <!-- 列表面板 -->
  <div class="list-panel glass-panel">
    <!-- 标签栏 -->
    <div class="tag-header" id="tagContainer">
      <button class="tag-btn active" data-tag="全部">全部</button>
      <button class="tag-btn add-btn" id="addTagBtn">+ 新建标签</button>
    </div>

    <div class="list-header">
      <h2 id="listTitle">全部歌曲 <span id="songCount">(0)</span></h2>
    </div>
    
    <ul class="playlist" id="playlist">
      <li class="status-msg">正在获取音频...</li>
    </ul>
  </div>
</div>

<!-- 浮动菜单 -->
<div class="context-menu" id="contextMenu">
  <div class="menu-item" id="menuDownload">⬇️ 下载歌曲</div>
  <div class="menu-item" id="menuTag">🏷️ 管理标签</div>
  <div class="menu-item" id="menuMoveUp">⬆️ 上移</div>
  <div class="menu-item" id="menuMoveDown">⬇️ 下移</div>
</div>

<!-- 新建标签弹窗 -->
<div class="modal-overlay" id="tagModal">
  <div class="modal-content">
    <h3>新建标签</h3>
    <input type="text" id="newTagInput" placeholder="输入标签名 (如：纯音乐)" maxlength="10">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeTagModal()">取消</button>
      <button class="btn-confirm" onclick="confirmAddTag()">确定</button>
    </div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
/* =========================================================
   1. 基础配置
   ========================================================= */
const CONFIG = {
  owner: 'yzcorpsdk2-ctrl',     // 你的 GitHub 用户名
  repo: 'soundsudio',           // 你的仓库名
  branch: 'main'                // 你的分支名
};

// DOM 元素
const audio = document.getElementById('audio');
const disc = document.getElementById('disc');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const modeBtn = document.getElementById('modeBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const progress = document.getElementById('progress');
const curTime = document.getElementById('curTime');
const durTime = document.getElementById('durTime');
const songTitle = document.getElementById('songTitle');
const songArtist = document.getElementById('songArtist');
const playlistEl = document.getElementById('playlist');
const songCount = document.getElementById('songCount');
const tagContainer = document.getElementById('tagContainer');
const tagLoopToggle = document.getElementById('tagLoopToggle');
const listTitle = document.getElementById('listTitle');

// 全局状态
let allSongs = [];           // 从 GitHub 拉取的所有原始歌曲数据
let displayedSongs = [];     // 当前界面上展示的歌曲
let customOrder = [];        // 自定义排序 (存储路径的数组)
let tagsList = ['全部'];     // 所有标签
let songTagsMap = {};        // 歌曲路径与标签的映射 { 'path.mp3': ['标签1'] }
let activeTag = '全部';      // 当前选中的标签
let currentIndex = -1;       // 当前播放的歌曲索引 (在 displayedSongs 中的索引)
let isPlaying = false;

// 播放模式
let repeatMode = 'all';      // 'all', 'one', 'off'
let isShuffle = false;
let isTagLoop = false;

// 菜单状态
let menuTargetSongPath = null;
let menuTargetIndex = -1;

/* =========================================================
   2. 本地存储初始化
   ========================================================= */
function loadLocalData() {
  try {
    const savedTags = localStorage.getItem('mp_tags');
    if (savedTags) tagsList = JSON.parse(savedTags);
    if (!tagsList.includes('全部')) tagsList.unshift('全部');

    const savedMap = localStorage.getItem('mp_songTags');
    if (savedMap) songTagsMap = JSON.parse(savedMap);

    const savedOrder = localStorage.getItem('mp_order');
    if (savedOrder) customOrder = JSON.parse(savedOrder);
  } catch(e) { console.warn('读取本地数据失败', e); }
}

function saveLocalData() {
  localStorage.setItem('mp_tags', JSON.stringify(tagsList));
  localStorage.setItem('mp_songTags', JSON.stringify(songTagsMap));
  localStorage.setItem('mp_order', JSON.stringify(customOrder));
}

/* =========================================================
   3. 核心逻辑：数据过滤与渲染
   ========================================================= */
async function fetchSongs() {
  const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/git/trees/${CONFIG.branch}?recursive=1`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('获取失败，请检查仓库信息');
    const data = await res.json();

    const baseUrl = `https://${CONFIG.owner}.github.io/${CONFIG.repo}/`;
    const mp3Files = data.tree.filter(item => item.type === 'blob' && item.path.toLowerCase().endsWith('.mp3'));

    allSongs = mp3Files.map(file => {
      const fileName = file.path.split('/').pop();
      const encodedPath = file.path.split('/').map(encodeURIComponent).join('/');
      return {
        name: fileName.replace(/\.mp3$/i, ''),
        path: file.path,
        url: baseUrl + encodedPath
      };
    });

    // 应用自定义排序
    if (customOrder.length > 0) {
      allSongs.sort((a, b) => {
        let idxA = customOrder.indexOf(a.path);
        let idxB = customOrder.indexOf(b.path);
        if (idxA === -1) idxA = 9999;
        if (idxB === -1) idxB = 9999;
        return idxA - idxB;
      });
    }

    renderTags();
    filterAndRenderList();

  } catch (error) {
    playlistEl.innerHTML = `<li class="status-msg" style="color:#ef4444">❌ ${error.message}</li>`;
  }
}

// 渲染标签
function renderTags() {
  tagContainer.innerHTML = '';
  tagsList.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = `tag-btn ${tag === activeTag ? 'active' : ''}`;
    btn.textContent = tag;
    btn.dataset.tag = tag;
    btn.addEventListener('click', () => {
      activeTag = tag;
      renderTags();
      filterAndRenderList();
    });
    tagContainer.appendChild(btn);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'tag-btn add-btn';
  addBtn.textContent = '+ 新建标签';
  addBtn.id = 'addTagBtn';
  addBtn.addEventListener('click', () => {
    document.getElementById('tagModal').classList.add('show');
    document.getElementById('newTagInput').focus();
  });
  tagContainer.appendChild(addBtn);
}

// 根据标签过滤并渲染列表
function filterAndRenderList() {
  if (activeTag === '全部') {
    displayedSongs = [...allSongs];
    listTitle.innerHTML = `全部歌曲 <span id="songCount">(${displayedSongs.length})</span>`;
  } else {
    displayedSongs = allSongs.filter(song => {
      const tags = songTagsMap[song.path] || [];
      return tags.includes(activeTag);
    });
    listTitle.innerHTML = `${activeTag} <span id="songCount">(${displayedSongs.length})</span>`;
  }

  if (displayedSongs.length === 0) {
    playlistEl.innerHTML = `<li class="status-msg">该分类下暂无歌曲</li>`;
    return;
  }

  playlistEl.innerHTML = displayedSongs.map((song, index) => {
    const songTags = songTagsMap[song.path] || [];
    const tagsHtml = songTags.map(t => `<span class="mini-tag">${t}</span>`).join('');
    
    // 判断是否是当前正在播放的歌曲
    let isActive = false;
    if (currentIndex >= 0 && currentIndex < displayedSongs.length) {
        isActive = displayedSongs[currentIndex].path === song.path;
    }

    return `
      <li class="track-item ${isActive ? 'active' : ''}" data-index="${index}" data-path="${song.path}">
        <div class="track-icon">MP3</div>
        <div class="track-info">
          <div class="track-name">${song.name}</div>
          <div class="track-path">${song.path}</div>
          <div class="track-tags">${tagsHtml}</div>
        </div>
        <div class="playing-indicator"><i></i><i></i><i></i></div>
        <button class="more-btn" onclick="openMenu(event, ${index}, '${song.path}')">⋮</button>
      </li>
    `;
  }).join('');
}

/* =========================================================
   4. 播放控制核心
   ========================================================= */
function getPlayPool() {
  // 如果开启了标签循环，且选中了具体标签，则在该标签下循环
  if (isTagLoop && activeTag !== '全部') {
    return displayedSongs;
  }
  // 否则在全部歌曲里循环
  return allSongs;
}

function loadSong(songObj) {
  if (!songObj) return;
  
  songTitle.textContent = songObj.name;
  songArtist.textContent = songObj.path;
  document.title = `${songObj.name} - 音乐播放器`;

  audio.src = songObj.url;
  
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: songObj.name, artist: 'GitHub 音乐', album: '我的收藏'
    });
  }

  // 重新渲染以更新高亮
  filterAndRenderList();
  // 滚动到当前播放项
  const activeEl = document.querySelector(`.track-item[data-path="${songObj.path}"]`);
  if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  audio.play().catch(() => { isPlaying = false; updatePlayUI(); });
}

function playAudio() {
  if (!audio.src) {
    const pool = getPlayPool();
    if (pool.length > 0) loadSong(pool[0]);
    return;
  }
  audio.play();
}

function pauseAudio() { audio.pause(); }

function updatePlayUI() {
  playBtn.textContent = isPlaying ? '⏸' : '▶';
  disc.classList.toggle('playing', isPlaying);
}

function handleNextPrev(direction) {
  const pool = getPlayPool();
  if (pool.length === 0) return;

  if (!audio.src) {
    loadSong(pool[0]);
    return;
  }

  // 找到当前歌曲在【播放池】中的索引
  let poolIndex = pool.findIndex(s => s.url === audio.src);
  if (poolIndex === -1) poolIndex = 0; // 如果不在当前池中（比如切了标签），默认从池子的第一首开始

  if (direction === 'next') {
    if (isShuffle) {
      poolIndex = Math.floor(Math.random() * pool.length);
    } else {
      poolIndex = (poolIndex + 1) % pool.length;
    }
    loadSong(pool[poolIndex]);
  } else {
    if (isShuffle) {
      poolIndex = Math.floor(Math.random() * pool.length);
    } else {
      poolIndex = (poolIndex - 1 + pool.length) % pool.length;
    }
    loadSong(pool[poolIndex]);
  }
}

/* =========================================================
   5. 菜单与标签管理交互
   ========================================================= */
const contextMenu = document.getElementById('contextMenu');
let menuTargetSong = null;

// 打开菜单
window.openMenu = function(e, index, path) {
  e.stopPropagation();
  menuTargetIndex = index;
  menuTargetSong = displayedSongs[index];
  menuTargetSongPath = path;

  // 定位菜单
  const rect = e.target.getBoundingClientRect();
  const menuWidth = 160;
  let left = rect.left - menuWidth + 20; // 稍微靠左对齐
  if (left < 10) left = 10; // 防止超出左边

  contextMenu.style.left = left + 'px';
  contextMenu.style.top = (rect.bottom + window.scrollY + 5) + 'px';
  contextMenu.classList.add('show');
};

// 关闭菜单
document.addEventListener('click', () => {
  contextMenu.classList.remove('show');
});

// 菜单操作：下载
document.getElementById('menuDownload').addEventListener('click', () => {
  if (menuTargetSong) {
    const a = document.createElement('a');
    a.href = menuTargetSong.url;
    a.download = `${menuTargetSong.name}.mp3`;
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
});

// 菜单操作：上下移
document.getElementById('menuMoveUp').addEventListener('click', () => {
  if (!menuTargetSong) return;
  const songPath = menuTargetSong.path;
  // 找到它在全局 allSongs 中的索引
  const globalIndex = allSongs.findIndex(s => s.path === songPath);
  if (globalIndex > 0) {
    // 交换位置
    [allSongs[globalIndex - 1], allSongs[globalIndex]] = [allSongs[globalIndex], allSongs[globalIndex - 1]];
    // 更新 customOrder
    customOrder = allSongs.map(s => s.path);
    saveLocalData();
    filterAndRenderList();
  }
});

document.getElementById('menuMoveDown').addEventListener('click', () => {
  if (!menuTargetSong) return;
  const songPath = menuTargetSong.path;
  const globalIndex = allSongs.findIndex(s => s.path === songPath);
  if (globalIndex !== -1 && globalIndex < allSongs.length - 1) {
    [allSongs[globalIndex + 1], allSongs[globalIndex]] = [allSongs[globalIndex], allSongs[globalIndex + 1]];
    customOrder = allSongs.map(s => s.path);
    saveLocalData();
    filterAndRenderList();
  }
});

// 菜单操作：管理标签
document.getElementById('menuTag').addEventListener('click', () => {
  if (!menuTargetSong) return;
  const path = menuTargetSong.path;
  const currentTags = songTagsMap[path] || [];
  
  // 生成一个简单的弹窗输入
  const availableTags = tagsList.filter(t => t !== '全部');
  if (availableTags.length === 0) {
    alert('还没有创建任何标签，请先点击顶部“+新建标签”');
    return;
  }

  let msg = `请为《${menuTargetSong.name}》选择标签（输入编号，空格隔开，当前标签：${currentTags.join(', ') || '无'}）：\n\n`;
  availableTags.forEach((t, i) => {
    msg += `${i + 1}. ${t}\n`;
  });
  
  const input = prompt(msg);
  if (input !== null) {
    const selectedIdxs = input.split(/\s+/).filter(x => x).map(x => parseInt(x) - 1);
    const newTags = [];
    selectedIdxs.forEach(i => {
      if (availableTags[i]) newTags.push(availableTags[i]);
    });
    if (newTags.length > 0) {
      songTagsMap[path] = newTags;
    } else {
      delete songTagsMap[path]; // 空则清除
    }
    saveLocalData();
    filterAndRenderList();
  }
});

/* =========================================================
   6. 标签 Modal 交互
   ========================================================= */
window.closeTagModal = function() {
  document.getElementById('tagModal').classList.remove('show');
  document.getElementById('newTagInput').value = '';
};

window.confirmAddTag = function() {
  const val = document.getElementById('newTagInput').value.trim();
  if (val && !tagsList.includes(val)) {
    tagsList.push(val);
    saveLocalData();
    renderTags();
    closeTagModal();
  } else if (tagsList.includes(val)) {
    alert('标签已存在！');
  }
};

/* =========================================================
   7. 事件绑定
   ========================================================= */
playlistEl.addEventListener('click', (e) => {
  // 如果点到的是菜单按钮，直接忽略（由菜单按钮自己的 stopPropagation 处理）
  if (e.target.closest('.more-btn')) return;

  const li = e.target.closest('.track-item');
  if (!li) return;

  const index = parseInt(li.dataset.index);
  const song = displayedSongs[index];

  if (audio.src === song.url) {
    // 同一首歌，切换播放
    if (isPlaying) pauseAudio(); else playAudio();
  } else {
    loadSong(song);
  }
});

playBtn.addEventListener('click', () => { if (isPlaying) pauseAudio(); else playAudio(); });
prevBtn.addEventListener('click', () => handleNextPrev('prev'));
nextBtn.addEventListener('click', () => handleNextPrev('next'));

modeBtn.addEventListener('click', () => {
  if (repeatMode === 'all') {
    repeatMode = 'one'; modeBtn.textContent = '🔂'; modeBtn.title = '单曲循环';
  } else if (repeatMode === 'one') {
    repeatMode = 'off'; modeBtn.textContent = '➡️'; modeBtn.title = '单次播放'; modeBtn.classList.remove('active');
  } else {
    repeatMode = 'all'; modeBtn.textContent = '🔁'; modeBtn.title = '列表循环'; modeBtn.classList.add('active');
  }
});

shuffleBtn.addEventListener('click', () => {
  isShuffle = !isShuffle;
  shuffleBtn.classList.toggle('active', isShuffle);
});

tagLoopToggle.addEventListener('change', (e) => {
  isTagLoop = e.target.checked;
  if (isTagLoop && activeTag === '全部') {
    alert('请先在顶部选择具体的标签，再开启标签循环。');
    tagLoopToggle.checked = false;
    isTagLoop = false;
  }
});

// 音频事件
audio.addEventListener('play', () => { isPlaying = true; updatePlayUI(); });
audio.addEventListener('pause', () => { isPlaying = false; updatePlayUI(); });

audio.addEventListener('ended', () => {
  if (repeatMode === 'one') {
    audio.currentTime = 0; audio.play();
  } else {
    handleNextPrev('next');
  }
});

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const p = audio.currentTime / audio.duration;
  progress.value = p * 1000;
  progress.style.setProperty('--p', (p * 100) + '%');
  curTime.textContent = fmtTime(audio.currentTime);
});

audio.addEventListener('loadedmetadata', () => {
  durTime.textContent = fmtTime(audio.duration);
  progress.disabled = false;
});

progress.addEventListener('input', () => {
  if (audio.duration) {
    const p = progress.value / 1000;
    progress.style.setProperty('--p', (p * 100) + '%');
    audio.currentTime = p * audio.duration;
  }
});

function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

// 初始化
loadLocalData();
fetchSongs();
</script>
