<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>音乐播放器 - 调试版</title>
<style>
  /* 原有样式保持不变 */
  :root{ --bg:#0b0e14; --panel:#12161f; --text:#e6e9ef; --muted:#8b93a7; --accent:#5b7cfa; --accent2:#a855f7; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:24px; display:flex; justify-content:center; }
  .app{ width:100%; max-width:1020px; height:calc(100vh - 48px); min-height:560px; display:grid; grid-template-columns:370px 1fr; gap:20px; }
  .player{ background:linear-gradient(165deg,#1b2233 0%, #12161f 65%); border:1px solid rgba(255,255,255,.07); border-radius:26px; padding:30px 26px; display:flex; flex-direction:column; align-items:center; gap:18px; overflow:hidden; }
  .disc{ width:172px; height:172px; border-radius:50%; background:repeating-radial-gradient(circle at 50% 50%, #242c40 0 2px, #1a2030 2px 5px); display:grid; place-items:center; }
  .disc-label{ width:66px; height:66px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent2)); display:grid; place-items:center; font-size:24px; color:#fff; }
  .track-title{ font-size:19px; font-weight:600; text-align:center; }
  .progress-wrap{ width:100%; display:flex; align-items:center; gap:10px; font-size:11.5px; color:var(--muted); }
  input[type=range]{ -webkit-appearance:none; background:transparent; cursor:pointer; height:16px; flex:1; }
  input[type=range]::-webkit-slider-runnable-track{ height:5px; border-radius:4px; background:rgba(255,255,255,.12); }
  .controls{display:flex; align-items:center; gap:14px;}
  .controls button{ background:none; border:none; color:var(--text); font-size:19px; width:42px; height:42px; border-radius:50%; cursor:pointer; }
  .controls button.main{ width:60px; height:60px; font-size:23px; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;}
  .list-panel{ background:var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:26px; display:flex; flex-direction:column; overflow:hidden; }
  .list-header{ padding:22px; border-bottom:1px solid rgba(255,255,255,.06); display:flex; flex-direction:column; gap:10px;}
  .playlist{ list-style:none; overflow-y:auto; flex:1; padding:10px 12px; }
  .track{ display:flex; align-items:center; gap:13px; padding:9px 12px; border-radius:13px; cursor:pointer; }
  .track:hover{background:rgba(255,255,255,.05);}
  .track.active{background:rgba(91,124,250,.15);}
  .thumb{ width:42px; height:42px; border-radius:11px; display:grid; place-items:center; font-size:12px; font-weight:700; background:#2a3450; }
  .info{min-width:0; flex:1;}
  .name{font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .path{font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .debug-box { padding: 15px; background: #1a2235; border-radius: 10px; font-size: 13px; color: #ffb8b8; word-break: break-all; margin-bottom: 10px;}
  .debug-box a { color: #9fb4ff; text-decoration: underline; }
</style>
</head>
<body>
<div class="app">
  <section class="player">
    <div class="disc"><div class="disc-label">♪</div></div>
    <div style="width:100%; text-align:center;">
      <div class="track-title" id="trackTitle">未选择曲目</div>
    </div>
    <div class="progress-wrap">
      <span id="curTime">0:00</span>
      <input type="range" id="progress" min="0" max="1000" value="0" disabled>
      <span id="durTime">0:00</span>
    </div>
    <div class="controls">
      <button id="prevBtn">⏮</button>
      <button id="playBtn" class="main">▶</button>
      <button id="nextBtn">⏭</button>
    </div>
  </section>

  <section class="list-panel">
    <div class="list-header">
      <h2>播放列表 <span id="count"></span></h2>
      <!-- 调试面板 -->
      <div class="debug-box" id="debugBox">
        正在测试音频链接状态...
      </div>
      <div style="font-size:12px; color:#8b93a7;">
        当前网页地址：<span id="currentUrl"></span>
      </div>
    </div>
    <ul class="playlist" id="playlist"></ul>
  </section>
</div>

<!-- 注意这里，我直接写死了文件名 -->
<audio id="audio" src="JVKE-her.mp3.mp3" preload="metadata"></audio>

<script>
// --- 核心配置 ---
// 注意：根据你的截图，文件名确认为 JVKE-her.mp3.mp3
const TARGET_FILE = 'JVKE-her.mp3.mp3'; 

const audio = document.getElementById('audio');
const elPlay = document.getElementById('playBtn');
const elProg = document.getElementById('progress');
const elCur = document.getElementById('curTime');
const elDur = document.getElementById('durTime');
const elList = document.getElementById('playlist');
const elDebug = document.getElementById('debugBox');
const elCurrentUrl = document.getElementById('currentUrl');

// 显示当前网页地址
elCurrentUrl.textContent = window.location.href;

// 1. 渲染列表
function renderList() {
  elList.innerHTML = `
    <li class="track active">
      <div class="thumb">MP3</div>
      <div class="info">
        <div class="name">JVKE-her</div>
        <div class="path">${TARGET_FILE}</div>
      </div>
    </li>
  `;
}
renderList();

// 2. 调试链接测试：主动 fetch 一下看能不能拿到文件
elDebug.innerHTML = `正在检测文件是否存在...`;
fetch(TARGET_FILE, { method: 'HEAD' })
  .then(res => {
    if (res.ok) {
      elDebug.innerHTML = `✅ 音频文件请求成功！<br>如果还是没声音，可能是格式问题或浏览器拦截。<br><a href="${TARGET_FILE}" target="_blank">点我直接在浏览器打开音频测试</a>`;
      elDebug.style.color = '#a3e6a3';
    } else {
      elDebug.innerHTML = `❌ 找不到文件！请检查文件名是否绝对一致。<br>服务器返回状态码: ${res.status}`;
    }
  })
  .catch(err => {
    elDebug.innerHTML = `❌ 请求发生网络错误：${err.message}`;
  });

// 3. 播放控制逻辑
function togglePlay() {
  if (audio.paused) {
    audio.play().catch(e => {
      alert('播放失败！原因：' + e.message + '\n这通常是因为文件不存在或浏览器不支持该格式。');
    });
  } else {
    audio.pause();
  }
}

elPlay.addEventListener('click', togglePlay);

audio.addEventListener('play', () => { elPlay.textContent = '⏸'; });
audio.addEventListener('pause', () => { elPlay.textContent = '▶'; });
audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    elCur.textContent = Math.floor(audio.currentTime / 60) + ':' + String(Math.floor(audio.currentTime % 60)).padStart(2,'0');
    elProg.value = (audio.currentTime / audio.duration) * 1000;
  }
});
audio.addEventListener('loadedmetadata', () => {
  elDur.textContent = Math.floor(audio.duration / 60) + ':' + String(Math.floor(audio.duration % 60)).padStart(2,'0');
  elProg.disabled = false;
});
audio.addEventListener('error', () => {
  alert('HTML5 Audio 报错！文件可能损坏、或浏览器不支持。');
});

elProg.addEventListener('input', () => {
  if (audio.duration) audio.currentTime = (elProg.value / 1000) * audio.duration;
});
</script>
</body>
</html>
