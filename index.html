<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>我的音乐播放器</title>
<style>
  :root {
    --primary: #6366f1;
    --primary-light: #818cf8;
    --text-dark: #1e293b;
    --text-light: #64748b;
    --glass-bg: rgba(255, 255, 255, 0.65);
    --glass-border: rgba(255, 255, 255, 0.8);
    --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
    background-attachment: fixed;
    color: var(--text-dark);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .app-container {
    width: 100%;
    max-width: 1000px;
    height: 85vh;
    min-height: 600px;
    display: flex;
    gap: 24px;
  }

  .glass-panel {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    box-shadow: var(--glass-shadow);
  }

  /* ================= 左侧播放器 ================= */
  .player-panel {
    flex: 0 0 380px;
    display: flex;
    flex-direction: column;
    padding: 30px;
    position: relative;
    overflow: hidden;
  }

  .cover-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
  }

  .disc {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
    display: grid;
    place-items: center;
    box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2), inset 0 0 0 10px rgba(255,255,255,0.5);
    position: relative;
    transition: transform 0.3s;
  }
  .disc.playing { animation: spin 15s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .disc::after {
    content: '♪';
    font-size: 40px;
    color: var(--primary);
    font-weight: bold;
  }

  .song-info { text-align: center; width: 100%; padding: 0 10px; }
  .song-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-artist { font-size: 13px; color: var(--text-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 进度条 */
  .progress-area { width: 100%; margin-top: 20px; }
  .time-wrap { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-light); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  
  input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; cursor: pointer; }
  input[type=range]:focus { outline: none; }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: rgba(0,0,0,0.08); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
    background: #fff; border: 3px solid var(--primary); margin-top: -5px;
    box-shadow: 0 2px 6px rgba(99,102,241,0.4); transition: transform 0.1s;
  }
  input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
  #progress::-webkit-slider-runnable-track { background: linear-gradient(to right, var(--primary) var(--p,0%), rgba(0,0,0,0.08) var(--p,0%)); }

  /* 控制按钮 */
  .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; }
  .btn-icon {
    background: none; border: none; font-size: 20px; color: var(--text-light);
    cursor: pointer; width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center; transition: all 0.2s;
  }
  .btn-icon:hover { background: rgba(255,255,255,0.6); color: var(--primary); }
  .btn-icon.active { color: var(--primary); }
  
  .btn-play {
    width: 64px; height: 64px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: white; font-size: 24px; cursor: pointer;
    box-shadow: 0 8px 20px rgba(99,102,241,0.4);
    display: grid; place-items: center; transition: transform 0.1s;
  }
  .btn-play:active { transform: scale(0.95); }

  /* ================= 右侧列表 ================= */
  .list-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 24px;
    overflow: hidden;
  }

  .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .list-header h2 { font-size: 18px; font-weight: 700; }
  .list-header span { font-size: 13px; color: var(--text-light); font-weight: normal; }

  /* 标签栏 */
  .tag-bar {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 12px;
    margin-bottom: 12px;
    border-bottom: 1px solid rgba(0,0,0,0.05);
    scrollbar-width: none; /* Firefox */
  }
  .tag-bar::-webkit-scrollbar { display: none; } /* Chrome/Safari */
  
  .tag-btn {
    white-space: nowrap;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid transparent;
    background: rgba(255,255,255,0.4);
    color: var(--text-light);
    cursor: pointer;
    transition: all 0.2s;
  }
  .tag-btn:hover { background: rgba(255,255,255,0.8); }
  .tag-btn.active {
    background: var(--primary);
    color: white;
    box-shadow: 0 4px 10px rgba(99,102,241,0.3);
  }

  .playlist { list-style: none; overflow-y: auto; flex: 1; padding-right: 8px; }
  .playlist::-webkit-scrollbar { width: 6px; }
  .playlist::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 3px; }

  .track-item {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 16px; border-radius: 16px; cursor: pointer;
    transition: all 0.2s; margin-bottom: 8px;
    border: 1px solid transparent;
  }
  .track-item:hover { background: rgba(255,255,255,0.5); }
  .track-item.active {
    background: rgba(255,255,255,0.8);
    border-color: var(--glass-border);
    box-shadow: 0 4px 15px rgba(0,0,0,0.03);
  }
  
  .track-icon {
    width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
    background: rgba(0,0,0,0.05); color: var(--text-light);
    transition: all 0.2s;
  }
  .track-item.active .track-icon {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: white;
  }

  .track-info { flex: 1; min-width: 0; }
  .track-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-path { font-size: 11px; color: var(--text-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  
  /* 下载按钮 */
  .download-btn {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 50%;
    color: var(--text-light); text-decoration: none; font-size: 16px;
    transition: all 0.2s; opacity: 0.6;
  }
  .download-btn:hover { background: rgba(0,0,0,0.05); color: var(--primary); opacity: 1; }

  .playing-indicator { display: none; gap: 3px; align-items: flex-end; height: 14px; margin-right: 8px;}
  .track-item.active .playing-indicator { display: flex; }
  .playing-indicator i {
    display: block; width: 3px; background: var(--primary); border-radius: 2px;
    animation: eq 1s infinite ease-in-out;
  }
  .playing-indicator i:nth-child(1) { height: 60%; animation-delay: 0s; }
  .playing-indicator i:nth-child(2) { height: 100%; animation-delay: -0.2s; }
  .playing-indicator i:nth-child(3) { height: 40%; animation-delay: -0.4s; }
  @keyframes eq { 0%, 100% { transform: scaleY(0.5); } 50% { transform: scaleY(1); } }

  .status-msg { text-align: center; color: var(--text-light); margin-top: 20px; font-size: 14px; }

  /* ================= 移动端适配 ================= */
  @media (max-width: 768px) {
    body { padding: 0; height: 100dvh; overflow: hidden; }
    .app-container {
      flex-direction: column; height: 100%; max-width: 100%; gap: 0;
    }
    .glass-panel { border-radius: 0; border: none; background: transparent; backdrop-filter: none; box-shadow: none; }
    
    .player-panel {
      flex: 0 0 auto; padding: 20px 20px 10px;
      background: var(--glass-bg); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--glass-border);
      z-index: 10;
    }
    .disc { width: 110px; height: 110px; font-size: 24px; box-shadow: 0 8px 20px rgba(99,102,241,0.2); }
    .disc::after { font-size: 30px; }
    .controls { margin-top: 15px; }
    .btn-play { width: 56px; height: 56px; font-size: 20px; }
    .progress-area { margin-top: 10px; }

    .list-panel { flex: 1; background: rgba(255,255,255,0.4); padding: 15px 10px; }
    .list-header { display: none; }
    
    .tag-bar {
      margin-bottom: 10px; padding-bottom: 10px;
      /* 允许边缘渐变消失效果 */
      mask-image: linear-gradient(to right, black 85%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, black 85%, transparent 100%);
    }

    .track-item { padding: 10px; margin-bottom: 4px; }
    .download-btn { font-size: 18px; opacity: 0.8; }
  }
</style>
</head>
<body>

<div class="app-container">
  
  <!-- 左侧 / 上方：播放器面板 -->
  <div class="player-panel glass-panel">
    <div class="cover-area">
      <div class="disc" id="disc"></div>
      <div class="song-info">
        <div class="song-title" id="songTitle">等待读取...</div>
        <div class="song-artist" id="songArtist">请确保仓库为公开状态</div>
      </div>
    </div>

    <div class="progress-area">
      <div class="time-wrap">
        <span id="curTime">0:00</span>
        <span id="durTime">0:00</span>
      </div>
      <input type="range" id="progress" min="0" max="1000" value="0" disabled>
    </div>

    <div class="controls">
      <button class="btn-icon active" id="modeBtn" title="列表循环">🔁</button>
      <button class="btn-icon" id="prevBtn">⏮</button>
      <button class="btn-play" id="playBtn">▶</button>
      <button class="btn-icon" id="nextBtn">⏭</button>
      <button class="btn-icon" id="shuffleBtn" title="随机播放">🔀</button>
    </div>
  </div>

  <!-- 右侧 / 下方：播放列表 -->
  <div class="list-panel glass-panel">
    <div class="list-header">
      <h2>播放列表 <span id="songCount">(0)</span></h2>
    </div>
    
    <!-- 标签筛选栏 -->
    <div class="tag-bar" id="tagBar">
      <!-- 动态生成标签 -->
    </div>

    <ul class="playlist" id="playlist">
      <li class="status-msg">正在读取仓库数据...</li>
    </ul>
  </div>

</div>

<audio id="audio" preload="metadata"></audio>

<script>
/* =========================================================
   1. 核心配置区
   ========================================================= */
const CONFIG = {
  owner: 'yzcorpsdk2-ctrl',     // 你的 GitHub 用户名
  repo: 'soundsudio',           // 你的仓库名
  branch: 'main'                // 你的分支名
};

/* =========================================================
   2. 状态变量
   ========================================================= */
const audio = document.getElementById('audio');
const disc = document.getElementById('disc');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const modeBtn = document.getElementById('modeBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const progress = document.getElementById('progress');
const curTime = document.getElementById('curTime');
const durTime = document.getElementById('durTime');
const songTitle = document.getElementById('songTitle');
const songArtist = document.getElementById('songArtist');
const playlistEl = document.getElementById('playlist');
const songCount = document.getElementById('songCount');
const tagBar = document.getElementById('tagBar');

let allSongs = [];        // 所有歌曲
let currentQueue = [];    // 当前标签下的播放队列
let currentIndex = -1;    // 在当前队列中的索引
let isPlaying = false;

let allTags = ['全部'];   // 所有标签
let activeTag = '全部';   // 当前选中的标签

// 播放模式
let repeatMode = 'all';   // 'all', 'one', 'off'
let isShuffle = false;

/* =========================================================
   3. 从 GitHub API 自动提取 MP3 文件并分类
   ========================================================= */
async function fetchSongs() {
  const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/git/trees/${CONFIG.branch}?recursive=1`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status === 403 ? 'API 请求超限，请稍后再试' : '读取失败，请检查仓库信息');
    const data = await res.json();

    const baseUrl = `https://${CONFIG.owner}.github.io/${CONFIG.repo}/`;
    const mp3Files = data.tree.filter(item => 
      item.type === 'blob' && item.path.toLowerCase().endsWith('.mp3')
    );

    if (mp3Files.length === 0) {
      playlistEl.innerHTML = '<li class="status-msg">仓库中没有找到 .mp3 文件哦</li>';
      return;
    }

    // 组装歌曲数据与标签
    allSongs = mp3Files.map(file => {
      const fileName = file.path.split('/').pop();
      const encodedPath = file.path.split('/').map(encodeURIComponent).join('/');
      
      // 提取分类（根据所在的文件夹名称）
      let tag = '未分类';
      if (file.path.includes('/')) {
        const parts = file.path.split('/');
        tag = parts[0]; // 默认取第一级文件夹名作为标签
      }

      return {
        name: fileName.replace(/\.mp3$/i, ''),
        path: file.path,
        url: baseUrl + encodedPath,
        tag: tag
      };
    });

    // 提取所有唯一标签
    const tagsSet = new Set(allSongs.map(s => s.tag));
    allTags = ['全部', ...Array.from(tagsSet)];

    renderTags();
    filterByTag('全部'); // 默认显示全部

  } catch (error) {
    console.error(error);
    playlistEl.innerHTML = `<li class="status-msg" style="color:#ef4444">❌ ${error.message}</li>`;
  }
}

/* =========================================================
   4. 渲染逻辑
   ========================================================= */
function renderTags() {
  tagBar.innerHTML = allTags.map(tag => `
    <button class="tag-btn ${tag === activeTag ? 'active' : ''}" data-tag="${tag}">
      ${tag}
    </button>
  `).join('');
}

function renderPlaylist() {
  if (currentQueue.length === 0) {
    playlistEl.innerHTML = '<li class="status-msg">该分类下暂无歌曲</li>';
    songCount.textContent = `(0)`;
    return;
  }

  playlistEl.innerHTML = currentQueue.map((song, index) => `
    <li class="track-item ${index === currentIndex ? 'active' : ''}" data-index="${index}">
      <div class="track-icon">MP3</div>
      <div class="track-info">
        <div class="track-name">${song.name}</div>
        <div class="track-path">${song.tag} · ${song.path}</div>
      </div>
      <div class="playing-indicator"><i></i><i></i><i></i></div>
      <!-- 下载按钮 -->
      <a href="${song.url}" download="${song.name}.mp3" class="download-btn" title="下载歌曲" onclick="event.stopPropagation()">⬇</a>
    </li>
  `).join('');
  
  songCount.textContent = `(${currentQueue.length})`;
}

// 标签筛选
function filterByTag(tag) {
  activeTag = tag;
  
  // 更新标签按钮 UI
  document.querySelectorAll('.tag-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tag === tag);
  });

  // 过滤队列
  if (tag === '全部') {
    currentQueue = [...allSongs];
  } else {
    currentQueue = allSongs.filter(s => s.tag === tag);
  }

  // 如果当前正在播放的歌曲属于新队列，保持状态；否则重置播放
  if (currentIndex !== -1 && isPlaying) {
    const currentSongUrl = audio.src;
    const stillInQueue = currentQueue.findIndex(s => s.url === currentSongUrl);
    if (stillInQueue !== -1) {
      currentIndex = stillInQueue; // 更新在新队列中的索引
    } else {
      // 切歌或暂停
      audio.pause();
      currentIndex = -1;
      songTitle.textContent = '已切换分类';
      songArtist.textContent = '请重新选择歌曲';
    }
  } else {
    currentIndex = -1;
  }

  renderPlaylist();
}

/* =========================================================
   5. 播放核心逻辑
   ========================================================= */
function loadSong(index, autoPlay = true) {
  if (index < 0 || index >= currentQueue.length) return;
  currentIndex = index;
  const song = currentQueue[index];

  songTitle.textContent = song.name;
  songArtist.textContent = song.path;
  document.title = `${song.name} - 音乐播放器`;

  renderPlaylist();

  audio.src = song.url;
  
  // 更新系统后台媒体控制信息
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.name,
      artist: `分类: ${song.tag}`,
      album: 'GitHub 音乐仓库'
    });
    navigator.mediaSession.setActionHandler('play', playAudio);
    navigator.mediaSession.setActionHandler('pause', pauseAudio);
    navigator.mediaSession.setActionHandler('previoustrack', () => handleNextPrev('prev'));
    navigator.mediaSession.setActionHandler('nexttrack', () => handleNextPrev('next'));
  }

  if (autoPlay) {
    audio.play().catch(err => {
      console.warn('播放失败:', err);
      isPlaying = false;
      updatePlayBtnUI();
    });
  }
}

function playAudio() {
  if (currentIndex === -1 && currentQueue.length > 0) {
    loadSong(isShuffle ? getRandomIndex() : 0);
  } else {
    audio.play();
  }
}

function pauseAudio() {
  audio.pause();
}

function updatePlayBtnUI() {
  playBtn.textContent = isPlaying ? '⏸' : '▶';
  if (isPlaying) {
    disc.classList.add('playing');
  } else {
    disc.classList.remove('playing');
  }
}

/* 计算下一首索引（只在当前队列内） */
function getNextIndex() {
  if (currentQueue.length === 0) return -1;
  if (currentQueue.length === 1) return 0;

  if (isShuffle) return getRandomIndex();

  if (currentIndex === currentQueue.length - 1) {
    if (repeatMode === 'off') return -1;
    return 0;
  }
  return currentIndex + 1;
}

function getRandomIndex() {
  if (currentQueue.length <= 1) return 0;
  let newIndex;
  do {
    newIndex = Math.floor(Math.random() * currentQueue.length);
  } while (newIndex === currentIndex);
  return newIndex;
}

function handleNextPrev(direction) {
  if (currentQueue.length === 0) return;
  
  if (direction === 'next') {
    const nextIdx = getNextIndex();
    if (nextIdx === -1) {
      audio.pause();
      audio.currentTime = 0;
      isPlaying = false;
      updatePlayBtnUI();
    } else {
      loadSong(nextIdx);
    }
  } else {
    let prevIdx;
    if (isShuffle) {
      prevIdx = getRandomIndex();
    } else {
      prevIdx = currentIndex - 1;
      if (prevIdx < 0) prevIdx = currentQueue.length - 1;
    }
    loadSong(prevIdx);
  }
}

/* =========================================================
   6. 事件监听与 UI 绑定
   ========================================================= */
// 标签点击
tagBar.addEventListener('click', (e) => {
  const btn = e.target.closest('.tag-btn');
  if (btn) filterByTag(btn.dataset.tag);
});

// 列表点击
playlistEl.addEventListener('click', (e) => {
  const li = e.target.closest('.track-item');
  if (!li) return;
  const index = parseInt(li.dataset.index);
  
  if (index === currentIndex) {
    if (isPlaying) pauseAudio();
    else playAudio();
  } else {
    loadSong(index);
  }
});

// 按钮事件
playBtn.addEventListener('click', () => {
  if (isPlaying) pauseAudio();
  else playAudio();
});

prevBtn.addEventListener('click', () => handleNextPrev('prev'));
nextBtn.addEventListener('click', () => handleNextPrev('next'));

modeBtn.addEventListener('click', () => {
  if (repeatMode === 'all') {
    repeatMode = 'one';
    modeBtn.textContent = '🔂';
    modeBtn.title = '单曲循环';
    modeBtn.classList.add('active');
  } else if (repeatMode === 'one') {
    repeatMode = 'off';
    modeBtn.textContent = '➡️';
    modeBtn.title = '单次播放';
    modeBtn.classList.remove('active');
  } else {
    repeatMode = 'all';
    modeBtn.textContent = '🔁';
    modeBtn.title = '列表循环';
    modeBtn.classList.add('active');
  }
});

shuffleBtn.addEventListener('click', () => {
  isShuffle = !isShuffle;
  shuffleBtn.classList.toggle('active', isShuffle);
});

// 音频事件
audio.addEventListener('play', () => {
  isPlaying = true;
  updatePlayBtnUI();
});
audio.addEventListener('pause', () => {
  isPlaying = false;
  updatePlayBtnUI();
});

audio.addEventListener('ended', () => {
  if (repeatMode === 'one') {
    audio.currentTime = 0;
    audio.play();
  } else {
    const nextIdx = getNextIndex();
    if (nextIdx === -1) {
      isPlaying = false;
      updatePlayBtnUI();
      audio.currentTime = 0;
    } else {
      loadSong(nextIdx);
    }
  }
});

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const p = audio.currentTime / audio.duration;
  progress.value = p * 1000;
  progress.style.setProperty('--p', (p * 100) + '%');
  curTime.textContent = fmtTime(audio.currentTime);
});

audio.addEventListener('loadedmetadata', () => {
  durTime.textContent = fmtTime(audio.duration);
  progress.disabled = false;
});

progress.addEventListener('input', () => {
  if (audio.duration) {
    const p = progress.value / 1000;
    progress.style.setProperty('--p', (p * 100) + '%');
    audio.currentTime = p * audio.duration;
  }
});

audio.addEventListener('error', () => {
  if (currentIndex >= 0) {

function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}
