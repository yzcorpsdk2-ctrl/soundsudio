<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的音乐播放器</title>
<style>
  :root {
    --bg: #121212;
    --surface: #1e1e1e;
    --surface-2: #2a2a2a;
    --text: #e8e8e8;
    --text-dim: #9a9a9a;
    --accent: #4fc3f7;
    --accent-dim: #2a7a9e;
    --border: #333;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px 16px 60px;
  }

  .app {
    width: 100%;
    max-width: 560px;
    background: var(--surface);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
    display: flex;
    flex-direction: column;
    max-height: 90vh;
  }

  .player-area {
    padding: 24px 24px 16px;
    background: linear-gradient(160deg, #1a2a33 0%, var(--surface) 60%);
    border-bottom: 1px solid var(--border);
  }

  .now-playing-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent);
    margin-bottom: 6px;
  }

  .now-playing-name {
    font-size: 20px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 18px;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  .progress-track {
    flex: 1;
    height: 6px;
    background: var(--surface-2);
    border-radius: 3px;
    cursor: pointer;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    width: 0%;
    pointer-events: none;
    transition: width .1s linear;
  }

  .controls-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-top: 16px;
  }

  .ctrl-btn {
    background: none;
    border: none;
    color: var(--text);
    font-size: 22px;
    cursor: pointer;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s, transform .1s;
  }
  .ctrl-btn:hover { background: var(--surface-2); }
  .ctrl-btn:active { transform: scale(.92); }

  .play-btn {
    width: 56px;
    height: 56px;
    font-size: 26px;
    background: var(--accent);
    color: #000;
  }
  .play-btn:hover { background: #6fd0f8; }

  .volume-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    color: var(--text-dim);
    font-size: 16px;
  }
  .volume-row input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    height: 4px;
  }

  /* 播放列表 */
  .playlist-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px 10px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: .8px;
  }

  .track-count {
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0;
    color: var(--accent);
  }

  #playlist {
    list-style: none;
    overflow-y: auto;
    flex: 1;
    padding: 0 8px 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--surface-2) transparent;
  }
  #playlist::-webkit-scrollbar { width: 6px; }
  #playlist::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 3px; }

  .track-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .12s;
    user-select: none;
  }
  .track-item:hover { background: var(--surface-2); }
  .track-item.active {
    background: rgba(79, 195, 247, .12);
    box-shadow: inset 3px 0 0 var(--accent);
  }

  .track-index {
    width: 26px;
    flex-shrink: 0;
    text-align: right;
    font-size: 12px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .track-item.active .track-index { color: var(--accent); }

  .track-name {
    flex: 1;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track-item.active .track-name { color: var(--accent); font-weight: 500; }

  .status-msg {
    padding: 30px 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.6;
  }
  .status-msg.error { color: #ef9a9a; }

  .spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid var(--surface-2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin-bottom: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 480px) {
    .app { max-height: 95vh; }
    .player-area { padding: 20px 18px 14px; }
    .now-playing-name { font-size: 17px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="player-area">
    <div class="now-playing-label">正在播放</div>
    <div class="now-playing-name" id="nowPlaying">—</div>

    <div class="progress-row">
      <span id="currentTime">0:00</span>
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span id="duration">0:00</span>
    </div>

    <div class="controls-row">
      <button class="ctrl-btn" id="prevBtn" title="上一首">⏮</button>
      <button class="ctrl-btn play-btn" id="playBtn" title="播放/暂停">▶</button>
      <button class="ctrl-btn" id="nextBtn" title="下一首">⏭</button>
    </div>

    <div class="volume-row">
      <span>🔊</span>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
    </div>
  </div>

  <div class="playlist-header">
    <span>播放列表</span>
    <span class="track-count" id="trackCount"></span>
  </div>

  <ul id="playlist">
    <li class="status-msg" id="statusMsg">
      <div class="spinner"></div><br>正在读取音乐文件…
    </li>
  </ul>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
(function () {
  "use strict";

  /* ============================================================
     配置区
     ============================================================
     如果你使用“方式一：GitHub API 自动发现”，请填写你的仓库信息。
     如果你只想用“方式二：顺序探测”，可以把 USE_GITHUB_API 设为 false。
     ============================================================ */
  const CONFIG = {
    // 是否使用 GitHub API 自动发现文件（推荐）
    USE_GITHUB_API: true,

    // ===== 方式一：GitHub API 配置 =====
    GITHUB: {
      owner: "你的GitHub用户名",   // 例如 "octocat"
      repo: "你的仓库名",          // 例如 "my-music"
      branch: "main",              // 通常是 "main" 或 "master"
      // 音频文件所在的仓库路径。如果文件就在仓库根目录，留空字符串 "";
      // 如果放在子目录（例如 audio/），写成 "audio"。
      audioDir: "",
    },

    // ===== 方式二：顺序探测配置 =====
    // 仅当 USE_GITHUB_API 为 false，或 API 调用失败时使用。
    SEQUENTIAL: {
      start: 1,          // 起始编号
      maxProbe: 200,     // 最多探测多少个编号（不要设得太大，否则很慢）
      stopAfterMiss: 5,  // 连续多少个编号不存在就停止
      extension: ".mp4", // 文件扩展名
    },

    // 自动播放下一首
    AUTO_NEXT: true,
    // 列表循环
    LOOP_PLAYLIST: true,
  };

  /* ============================================================
     元素引用
     ============================================================ */
  const audio = document.getElementById("audio");
  const playlistEl = document.getElementById("playlist");
  const statusMsg = document.getElementById("statusMsg");
  const nowPlaying = document.getElementById("nowPlaying");
  const playBtn = document.getElementById("playBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const currentTimeEl = document.getElementById("currentTime");
  const durationEl = document.getElementById("duration");
  const progressTrack = document.getElementById("progressTrack");
  const progressFill = document.getElementById("progressFill");
  const volumeSlider = document.getElementById("volumeSlider");
  const trackCount = document.getElementById("trackCount");

  /* ============================================================
     状态
     ============================================================ */
  let tracks = [];        // { name, url, displayName }
  let currentIndex = -1;
  let isSeeking = false;

  /* ============================================================
     工具函数
     ============================================================ */
  function formatTime(sec) {
    if (!isFinite(sec) || sec < 0) return "0:00";
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function naturalSort(a, b) {
    return a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });
  }

  function setStatus(text, isError) {
    statusMsg.innerHTML = text;
    statusMsg.className = "status-msg" + (isError ? " error" : "");
  }

  /* ============================================================
     方式一：通过 GitHub API 自动发现
     ============================================================ */
  async function discoverViaGitHubAPI() {
    const { owner, repo, branch, audioDir } = CONFIG.GITHUB;
    if (!owner || owner === "你的GitHub用户名" || !repo || repo === "你的仓库名") {
      throw new Error("请在 CONFIG.GITHUB 中填写你的 GitHub 用户名和仓库名。");
    }

    // Git Trees API：一次请求获取整个仓库树（recursive=1）
    const apiUrl = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/git/trees/${encodeURIComponent(branch)}?recursive=1`;

    const resp = await fetch(apiUrl, {
      headers: { Accept: "application/vnd.github+json" },
    });

    if (!resp.ok) {
      if (resp.status === 403 || resp.status === 429) {
        throw new Error("GitHub API 请求次数已达上限，请稍后再试，或改用顺序探测模式。");
      }
      if (resp.status === 404) {
        throw new Error("找不到仓库或分支，请检查 CONFIG.GITHUB 中的 owner / repo / branch 是否正确。");
      }
      throw new Error("GitHub API 请求失败（" + resp.status + "）");
    }

    const data = await resp.json();
    if (!data.tree || !Array.isArray(data.tree)) {
      throw new Error("GitHub API 返回格式异常。");
    }

    // 筛选 .mp4 文件
    let prefix = audioDir.replace(/^\/+|\/+$/g, "");
    if (prefix) prefix += "/";

    const files = data.tree
      .filter(item => {
        if (item.type !== "blob") return false;
        if (!item.path.toLowerCase().endsWith(".mp4")) return false;
        if (prefix && !item.path.startsWith(prefix)) return false;
        return true;
      })
      .map(item => {
        // 取文件名（不含路径）作为显示名
        const fullPath = item.path;
        const fileName = fullPath.split("/").pop();
        const displayName = fileName.replace(/\.mp4$/i, "");
        // 构建相对于当前页面的 URL
        // 如果文件在根目录，直接使用文件名；如果在子目录，使用相对路径
        const url = prefix ? "./" + fullPath : "./" + fileName;
        return { name: fileName, url, displayName };
      });

    files.sort((a, b) => naturalSort(a.name, b.name));
    return files;
  }

  /* ============================================================
     方式二：顺序探测
     ============================================================ */
  async function discoverSequentially() {
    const { start, maxProbe, stopAfterMiss, extension } = CONFIG.SEQUENTIAL;
    const found = [];
    let missCount = 0;

    // 并发控制：每次同时检查 6 个，避免请求过多
    const CONCURRENCY = 6;
    let nextNumber = start;
    let exhausted = false;

    async function probe(n) {
      const fileName = String(n).padStart(4, "0") + extension;
      const url = "./" + fileName;
      try {
        const resp = await fetch(url, { method: "HEAD" });
        if (resp.ok) {
          return { name: fileName, url, displayName: fileName.replace(/\.[^.]+$/, "") };
        }
      } catch (e) {
        // 网络错误，视为不存在
      }
      return null;
    }

    while (!exhausted && nextNumber < start + maxProbe) {
      const batch = [];
      for (let i = 0; i < CONCURRENCY && nextNumber < start + maxProbe; i++) {
        batch.push(probe(nextNumber));
        nextNumber++;
      }
      const results = await Promise.all(batch);

      for (const r of results) {
        if (r) {
          found.push(r);
          missCount = 0;
        } else {
          missCount++;
          if (missCount >= stopAfterMiss) {
            exhausted = true;
            break;
          }
        }
      }

      // 更新进度提示
      setStatus(`正在探测文件… 已找到 ${found.length} 首`);
    }

    found.sort((a, b) => naturalSort(a.name, b.name));
    return found;
  }

  /* ============================================================
     加载曲目
     ============================================================ */
  async function loadTracks() {
    setStatus('<div class="spinner"></div><br>正在读取音乐文件…');

    let list = [];

    if (CONFIG.USE_GITHUB_API) {
      try {
        list = await discoverViaGitHubAPI();
      } catch (err) {
        console.warn("GitHub API 发现失败，将回退到顺序探测：", err.message);
        setStatus("API 发现失败，正在尝试顺序探测…");
        try {
          list = await discoverSequentially();
        } catch (e2) {
          setStatus(
            "无法加载音乐列表。<br><br>" +
            "原因：" + err.message + "<br><br>" +
            "你可以检查 CONFIG 中的仓库信息，或把 USE_GITHUB_API 设为 false 来使用顺序探测。",
            true
          );
          return;
        }
      }
    } else {
      try {
        list = await discoverSequentially();
      } catch (e) {
        setStatus("顺序探测失败：" + e.message, true);
        return;
      }
    }

    if (!list.length) {
      setStatus(
        "没有找到任何 .mp4 文件。<br><br>" +
        "请确认：<br>" +
        "1. 文件已上传到仓库；<br>" +
        "2. 文件是 .mp4 后缀；<br>" +
        "3. 如果使用 API 模式，CONFIG.GITHUB 中的路径是否正确。",
        true
      );
      return;
    }

    tracks = list;
    renderPlaylist();
    trackCount.textContent = tracks.length + " 首";
    setStatus("加载完成");
    statusMsg.style.display = "none";

    // 自动选中第一首（但不自动播放，遵守浏览器策略）
    if (tracks.length > 0) {
      selectTrack(0, false);
    }
  }

  /* ============================================================
     渲染播放列表
     ============================================================ */
  function renderPlaylist() {
    playlistEl.innerHTML = "";
    tracks.forEach((track, i) => {
      const li = document.createElement("li");
      li.className = "track-item";
      li.dataset.index = i;

      const idx = document.createElement("span");
      idx.className = "track-index";
      idx.textContent = String(i + 1).padStart(2, "0");

      const name = document.createElement("span");
      name.className = "track-name";
      name.textContent = track.displayName || track.name;

      li.appendChild(idx);
      li.appendChild(name);
      li.addEventListener("click", () => selectTrack(i, true));
      playlistEl.appendChild(li);
    });
  }

  function highlightCurrent() {
    const items = playlistEl.querySelectorAll(".track-item");
    items.forEach((el, i) => {
      el.classList.toggle("active", i === currentIndex);
    });
    // 滚动到当前项
    if (currentIndex >= 0 && items[currentIndex]) {
      items[currentIndex].scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
  }

  /* ============================================================
     选择 / 播放
     ============================================================ */
  function selectTrack(index, autoPlay) {
    if (index < 0 || index >= tracks.length) return;
    currentIndex = index;
    const track = tracks[index];

    audio.src = track.url;
    audio.load();
    nowPlaying.textContent = track.displayName || track.name;
    highlightCurrent();
    resetProgress();

    if (autoPlay) {
      audio.play().catch(() => {
        // 自动播放被阻止，忽略
      });
    }
    updatePlayButton();
  }

  function resetProgress() {
    progressFill.style.width = "0%";
    currentTimeEl.textContent = "0:00";
    durationEl.textContent = "0:00";
  }

  function updatePlayButton() {
    if (audio.paused) {
      playBtn.textContent = "▶";
    } else {
      playBtn.textContent = "⏸";
    }
  }

  /* ============================================================
     播放控制
     ============================================================ */
  function togglePlay() {
    if (currentIndex < 0) {
      if (tracks.length > 0) selectTrack(0, true);
      return;
    }
    if (audio.paused) {
      audio.play().catch(() => {});
    } else {
      audio.pause();
    }
  }

  function playNext() {
    if (!tracks.length) return;
    let next = currentIndex + 1;
    if (next >= tracks.length) {
      if (CONFIG.LOOP_PLAYLIST) {
        next = 0;
      } else {
        return;
      }
    }
    selectTrack(next, true);
  }

  function playPrev() {
    if (!tracks.length) return;
    // 如果当前播放超过 3 秒，先回到本曲开头
    if (audio.currentTime > 3) {
      audio.currentTime = 0;
      return;
    }
    let prev = currentIndex - 1;
    if (prev < 0) {
      if (CONFIG.LOOP_PLAYLIST) {
        prev = tracks.length - 1;
      } else {
        return;
      }
    }
    selectTrack(prev, true);
  }

  /* ============================================================
     事件绑定
     ============================================================ */
  playBtn.addEventListener("click", togglePlay);
  prevBtn.addEventListener("click", playPrev);
  nextBtn.addEventListener("click", playNext);

  audio.addEventListener("play", updatePlayButton);
  audio.addEventListener("pause", updatePlayButton);

  audio.addEventListener("ended", function () {
    if (CONFIG.AUTO_NEXT) {
      playNext();
    } else {
      updatePlayButton();
    }
  });

  audio.addEventListener("loadedmetadata", function () {
    durationEl.textContent = formatTime(audio.duration);
  });

  audio.addEventListener("timeupdate", function () {
    if (isSeeking) return;
    const cur = audio.currentTime;
    const dur = audio.duration;
    currentTimeEl.textContent = formatTime(cur);
    if (isFinite(dur) && dur > 0) {
      progressFill.style.width = (cur / dur * 100) + "%";
    }
  });

  // 进度条点击 / 拖动
  progressTrack.addEventListener("click", function (e) {
    if (!isFinite(audio.duration) || audio.duration <= 0) return;
    const rect = progressTrack.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    audio.currentTime = ratio * audio.duration;
  });

  // 音量
  volumeSlider.addEventListener("input", function () {
    audio.volume = parseFloat(this.value);
  });
  audio.volume = parseFloat(volumeSlider.value);

  // 键盘快捷键
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT") return;
    if (e.code === "Space") {
      e.preventDefault();
      togglePlay();
    } else if (e.code === "ArrowRight" && e.shiftKey) {
      playNext();
    } else if (e.code === "ArrowLeft" && e.shiftKey) {
      playPrev();
    }
  });

  /* ============================================================
     启动
     ============================================================ */
  loadTracks();
})();
</script>
</body>
</html>
