<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>音乐播放器</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#12161f; --panel2:#1a2030;
    --text:#e6e9ef; --muted:#8b93a7;
    --accent:#5b7cfa; --accent2:#a855f7;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 600px at 20% -10%, #1b2440 0%, transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, #2a1b3d 0%, transparent 55%),
      var(--bg);
    color:var(--text); min-height:100vh; padding:24px;
    display:flex; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  .app{
    width:100%; max-width:1020px; height:calc(100vh - 48px); min-height:560px;
    display:grid; grid-template-columns:370px 1fr; gap:20px;
  }

  /* ---------- 左侧播放器 ---------- */
  .player{
    background:linear-gradient(165deg,#1b2233 0%, #12161f 65%);
    border:1px solid rgba(255,255,255,.07);
    border-radius:26px; padding:30px 26px;
    display:flex; flex-direction:column; align-items:center; gap:18px;
    box-shadow:0 24px 60px rgba(0,0,0,.45);
    overflow:hidden;
  }

  .disc{
    position:relative; width:172px; height:172px; border-radius:50%;
    background:repeating-radial-gradient(circle at 50% 50%, #242c40 0 2px, #1a2030 2px 5px);
    display:grid; place-items:center; flex-shrink:0;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06), 0 18px 45px rgba(0,0,0,.55);
    transition:box-shadow .3s;
  }
  .disc::before{
    content:''; position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 32% 26%, rgba(255,255,255,.16), transparent 46%);
    pointer-events:none;
  }
  .disc-label{
    width:66px; height:66px; border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid; place-items:center; font-size:24px; color:#fff;
    box-shadow:0 6px 20px rgba(91,124,250,.55); z-index:1;
  }
  .disc.spinning{animation:spin 14s linear infinite;}
  .disc.spinning .disc-label{animation:spin 14s linear infinite reverse;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .track-title{
    font-size:19px; font-weight:600; text-align:center; line-height:1.35;
    max-width:100%; overflow:hidden; text-overflow:ellipsis;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    word-break:break-word;
  }
  .track-sub{font-size:12.5px; color:var(--muted); text-align:center; max-width:100%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .progress-wrap{
    width:100%; display:flex; align-items:center; gap:10px;
    font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums;
  }
  .progress-wrap span{min-width:36px; text-align:center;}

  input[type=range]{
    -webkit-appearance:none; appearance:none; background:transparent;
    cursor:pointer; height:16px; flex:1;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:5px; border-radius:4px; background:rgba(255,255,255,.12);
  }
  #progress::-webkit-slider-runnable-track{
    background:linear-gradient(to right, var(--accent) var(--p,0%), rgba(255,255,255,.12) var(--p,0%));
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background:#fff; margin-top:-4px; box-shadow:0 0 0 4px rgba(91,124,250,.22);
    transition:box-shadow .15s;
  }
  input[type=range]:hover::-webkit-slider-thumb{box-shadow:0 0 0 6px rgba(91,124,250,.28);}
  input[type=range]::-moz-range-track{height:5px;border-radius:4px;background:rgba(255,255,255,.12);}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:#fff;}

  .controls{display:flex; align-items:center; gap:14px; margin-top:2px;}
  .controls button{
    background:none; border:none; color:var(--text); font-size:19px;
    width:42px; height:42px; border-radius:50%; cursor:pointer;
    display:grid; place-items:center; transition:background .15s, transform .1s, color .15s;
    opacity:.8;
  }
  .controls button:hover{background:rgba(255,255,255,.08); opacity:1;}
  .controls button:active{transform:scale(.92);}
  .controls button.active{color:var(--accent); opacity:1;}
  .controls button.main{
    width:60px; height:60px; font-size:23px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 8px 26px rgba(91,124,250,.42); opacity:1;
  }
  .controls button.main:hover{filter:brightness(1.1);}

  .volume{display:flex; align-items:center; gap:10px; width:100%; margin-top:auto; padding-top:6px;}
  .volume span{font-size:15px; opacity:.75;}
  .volume input{flex:1;}

  /* ---------- 右侧列表 ---------- */
  .list-panel{
    background:var(--panel);
    border:1px solid rgba(255,255,255,.07);
    border-radius:26px; display:flex; flex-direction:column;
    overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.4);
  }
  .list-header{
    padding:22px 22px 14px; display:flex; align-items:center; gap:14px;
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .list-header h2{font-size:16px; font-weight:600; white-space:nowrap;}
  .list-header h2 span{color:var(--muted); font-weight:400; font-size:13px;}
  .list-header input[type=text]{
    margin-left:auto; width:190px; max-width:45%;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08);
    color:var(--text); padding:8px 13px; border-radius:20px; font-size:13px;
    outline:none; transition:border-color .15s, background .15s;
  }
  .list-header input[type=text]:focus{border-color:rgba(91,124,250,.6); background:rgba(255,255,255,.09);}
  .list-header input::placeholder{color:#6b7385;}

  .playlist{list-style:none; overflow-y:auto; flex:1; padding:10px 12px 16px;}
  .playlist::-webkit-scrollbar{width:8px;}
  .playlist::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12); border-radius:4px;}
  .playlist::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2);}

  .track{
    display:flex; align-items:center; gap:13px;
    padding:9px 12px; border-radius:13px; cursor:pointer;
    transition:background .15s;
  }
  .track:hover{background:rgba(255,255,255,.05);}
  .track.active{background:rgba(91,124,250,.15);}
  .track.active .name{color:#9fb4ff;}

  .thumb{
    width:42px; height:42px; border-radius:11px; flex-shrink:0;
    display:grid; place-items:center; font-size:10px; font-weight:700; letter-spacing:.4px;
    color:#cdd6ff; background:linear-gradient(135deg,#2a3450,#1c2437);
    border:1px solid rgba(255,255,255,.07);
  }
  .track.active .thumb{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff; border-color:transparent;
    box-shadow:0 4px 14px rgba(91,124,250,.4);
  }

  .info{min-width:0; flex:1;}
  .name{font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .path{font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px;}

  .eq{display:none; gap:2.5px; align-items:flex-end; height:15px; flex-shrink:0; margin-right:4px;}
  .track.playing .eq{display:flex;}
  .eq i{display:block; width:3px; border-radius:2px; transform-origin:bottom;
    background:linear-gradient(180deg,var(--accent),var(--accent2));
    animation:eq .9s ease-in-out infinite;}
  .eq i:nth-child(1){height:55%; animation-delay:-.25s;}
  .eq i:nth-child(2){height:100%; animation-delay:-.55s;}
  .eq i:nth-child(3){height:40%; animation-delay:-.1s;}
  @keyframes eq{0%,100%{transform:scaleY(.35);}50%{transform:scaleY(1);}}

  .empty, .status{
    padding:20px 22px; font-size:13px; color:var(--muted); text-align:center; line-height:1.7;
  }
  .status.error{color:#ff9d9d;}
  .status:empty{display:none;}

  @media (max-width:780px){
    body{padding:12px;}
    .app{grid-template-columns:1fr; height:auto; gap:14px;}
    .list-panel{height:64vh; min-height:340px;}
    .disc{width:140px; height:140px;}
    .disc-label{width:56px; height:56px; font-size:20px;}
  }
</style>
</head>
<body>

<div class="app">
  <!-- 播放器 -->
  <section class="player">
    <div class="disc" id="disc"><div class="disc-label">♪</div></div>

    <div style="width:100%">
      <div class="track-title" id="trackTitle">未选择曲目</div>
      <div class="track-sub" id="trackSub">在右侧列表中点击任意音频开始播放</div>
    </div>

    <div class="progress-wrap">
      <span id="curTime">0:00</span>
      <input type="range" id="progress" min="0" max="1000" step="1" value="0">
      <span id="durTime">0:00</span>
    </div>

    <div class="controls">
      <button id="shuffleBtn" title="随机播放">🔀</button>
      <button id="prevBtn" title="上一首">⏮</button>
      <button id="playBtn" class="main" title="播放 / 暂停">▶</button>
      <button id="nextBtn" title="下一首">⏭</button>
      <button id="repeatBtn" title="循环：列表循环">🔁</button>
    </div>

    <div class="volume">
      <span id="volIcon">🔊</span>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
    </div>
  </section>

  <!-- 列表 -->
  <section class="list-panel">
    <div class="list-header">
      <h2>播放列表 <span id="count"></span></h2>
      <input type="text" id="search" placeholder="搜索音频…">
    </div>
    <ul class="playlist" id="playlist"></ul>
    <div class="status" id="status">正在读取仓库中的音频文件…</div>
  </section>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
/* =========================================================
   ① 配置区（已开启手动列表，跳过 API 请求）
   ========================================================= */
const CONFIG = {
  owner: 'yzcorpsdk2-ctrl',  
  repo:  'soundsudio',       
  branch:'main',             
  dir:   '',                 
  // 这里已经将文件名改为了双后缀的格式
  manualFiles: [
    'JVKE-her.mp3.mp3' 
  ]            
};

/* =========================================================
   ② 常量与工具
   ========================================================= */
const AUDIO_EXTS = new Set([
  'mp3','mp4','m4a','m4b','wav','ogg','oga','opus',
  'aac','flac','webm','weba','3gp','3gpp','aif','aiff'
]);

const $ = id => document.getElementById(id);

const audio     = $('audio');
const elList    = $('playlist');
const elSearch  = $('search');
const elStatus  = $('status');
const elCount   = $('count');
const elTitle   = $('trackTitle');
const elSub     = $('trackSub');
const elDisc    = $('disc');
const elPlay    = $('playBtn');
const elPrev    = $('prevBtn');
const elNext    = $('nextBtn');
const elShuffle = $('shuffleBtn');
const elRepeat  = $('repeatBtn');
const elProg    = $('progress');
const elCur     = $('curTime');
const elDur     = $('durTime');
const elVol     = $('volume');
const elVolIcon = $('volIcon');

const state = {
  files: [],
  view: [],
  index: -1,
  playing: false,
  seeking: false,
  shuffle: false,
  repeat: 'all'   // 'all' | 'one' | 'off'
};

function isAudioPath(p){
  const m = /\.([a-z0-9]+)$/i.exec(p);
  return !!m && AUDIO_EXTS.has(m[1].toLowerCase());
}

function encodePath(p){
  return p.split('/').map(encodeURIComponent).join('/');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

function fmtTime(sec){
  if (!isFinite(sec) || sec < 0) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function setStatus(msg, isError){
  elStatus.textContent = msg || '';
  elStatus.classList.toggle('error', !!isError);
}

/* =========================================================
   ③ 收集音频文件 (完全跳过 GitHub API)
   ========================================================= */
function makeTrack(path, url){
  const fileName = path.split('/').pop();
  // 优化：如果名字是 xx.mp3.mp3，展示时去掉多余的 .mp3
  const displayName = fileName.replace(/(\.mp3)+$/i, '');
  const ext = (fileName.match(/\.([^.]+)$/) || [,''])[1];
  return {
    path,
    url,
    name: displayName || fileName,
    ext: ext ? ext.toUpperCase() : '♪'
  };
}

async function collectFiles(){
  if (!CONFIG.manualFiles || !CONFIG.manualFiles.length){
    throw new Error('请在代码的 CONFIG.manualFiles 中填写音频文件名');
  }
  
  let baseUrl = location.href;
  if (baseUrl.endsWith('index.html')) {
      baseUrl = baseUrl.replace('index.html', '');
  } else if (!baseUrl.endsWith('/')) {
      baseUrl += '/';
  }

  return CONFIG.manualFiles
    .filter(isAudioPath)
    .map(p => makeTrack(p, new URL(encodePath(p), baseUrl).href));
}

/* =========================================================
   ④ 渲染
   ========================================================= */
function renderList(){
  const q = elSearch.value.trim().toLowerCase();

  state.view = state.files
    .map((_, i) => i)
    .filter(i => {
      if (!q) return true;
      const f = state.files[i];
      return f.name.toLowerCase().includes(q) || f.path.toLowerCase().includes(q);
    });

  if (!state.view.length){
    elList.innerHTML = '<li class="empty">没有匹配的音频</li>';
    return;
  }

  elList.innerHTML = state.view.map(i => {
    const f = state.files[i];
    const cls = 'track' + (i === state.index ? ' active' : '') +
                (i === state.index && state.playing ? ' playing' : '');
    return `
      <li class="${cls}" data-index="${i}">
        <div class="thumb">${escapeHtml(f.ext)}</div>
        <div class="info">
          <div class="name" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</div>
          <div class="path" title="${escapeHtml(f.path)}">${escapeHtml(f.path)}</div>
        </div>
        <div class="eq"><i></i><i></i><i></i></div>
      </li>`;
  }).join('');
}

function updateNowPlaying(f){
  elTitle.textContent = f ? f.name : '未选择曲目';
  elSub.textContent = f ? f.path : '在右侧列表中点击任意音频开始播放';
  document.title = f ? `${f.name} · 音乐播放器` : '音乐播放器';
}

/* =========================================================
   ⑤ 播放控制
   ========================================================= */
function playIndex(i){
  if (i < 0 || i >= state.files.length) return;
  const f = state.files[i];
  state.index = i;

  audio.src = f.url;
  audio.play().catch(err => {
    console.warn(err);
    setStatus(`无法播放「${f.name}」：${err.message || '格式不支持或文件路径错误'}`, true);
  });

  updateNowPlaying(f);
  renderList();
  elStatus.textContent = '';
}

function togglePlay(){
  if (state.index < 0){
    if (state.files.length) playIndex(0);
    return;
  }
  if (audio.paused) {
    audio.play().catch(err => setStatus('播放失败：' + (err.message || '未知错误'), true));
  } else {
    audio.pause();
  }
}

function nextTrack(manual){
  if (!state.files.length) return;

  if (state.shuffle && state.files.length > 1){
    let i;
    do { i = Math.floor(Math.random() * state.files.length); } while (i === state.index);
    playIndex(i);
    return;
  }

  const isLast = state.index >= state.files.length - 1;
  if (isLast && !manual && state.repeat === 'off'){
    state.playing = false;
    renderList();
    return;
  }
  playIndex((state.index + 1) % state.files.length);
}

function prevTrack(){
  if (!state.files.length) return;
  if (audio.currentTime > 3){
    audio.currentTime = 0;
    return;
  }
  if (state.shuffle && state.files.length > 1){
    let i;
    do { i = Math.floor(Math.random() * state.files.length); } while (i === state.index);
    playIndex(i);
    return;
  }
  playIndex((state.index - 1 + state.files.length) % state.files.length);
}

function updatePlayBtn(){
  elPlay.textContent = state.playing ? '⏸' : '▶';
}

function syncRepeatUI(){
  elRepeat.classList.toggle('active', state.repeat !== 'off');
  elRepeat.textContent = state.repeat === 'one' ? '🔂' : '🔁';
  elRepeat.title = state.repeat === 'one' ? '单曲循环'
                  : state.repeat === 'all' ? '列表循环'
                  : '不循环';
  elShuffle.classList.toggle('active', state.shuffle);
}

/* =========================================================
   ⑥ 事件绑定
   ========================================================= */
elList.addEventListener('click', e => {
  const li = e.target.closest('.track');
  if (!li) return;
  const i = Number(li.dataset.index);
  if (i === state.index && !audio.paused){
    audio.pause();
  } else if (i === state.index && audio.paused && audio.src){
    audio.play();
  } else {
    playIndex(i);
  }
});

elSearch.addEventListener('input', renderList);

elPlay.addEventListener('click', togglePlay);
elNext.addEventListener('click', () => nextTrack(true));
elPrev.addEventListener('click', prevTrack);

elShuffle.addEventListener('click', () => {
  state.shuffle = !state.shuffle;
  syncRepeatUI();
});

elRepeat.addEventListener('click', () => {
  state.repeat = state.repeat === 'all' ? 'one'
               : state.repeat === 'one' ? 'off'
               : 'all';
  syncRepeatUI();
});

/* 进度条 */
elProg.addEventListener('input', () => {
  state.seeking = true;
  const p = elProg.value / 1000;
  elProg.style.setProperty('--p', (p * 100) + '%');
  if (audio.duration) elCur.textContent = fmtTime(p * audio.duration);
});
elProg.addEventListener('change', () => {
  if (audio.duration) audio.currentTime = (elProg.value / 1000) * audio.duration;
  state.seeking = false;
});

/* 音量 */
function updateVolIcon(){
  const v = audio.volume;
  elVolIcon.textContent = v === 0 ? '🔇' : v < 0.5 ? '🔉' : '🔊';
  elVol.style.setProperty('--p', (v * 100) + '%');
}
elVol.addEventListener('input', () => {
  audio.volume = parseFloat(elVol.value);
  localStorage.setItem('mp_volume', audio.volume);
  updateVolIcon();
});

/* 音频事件 */
audio.addEventListener('timeupdate', () => {
  if (state.seeking || !audio.duration) return;
  const p = audio.currentTime / audio.duration;
  elProg.value = p * 1000;
  elProg.style.setProperty('--p', (p * 100) + '%');
  elCur.textContent = fmtTime(audio.currentTime);
});

audio.addEventListener('loadedmetadata', () => {
  elDur.textContent = fmtTime(audio.duration);
});

audio.addEventListener('play', () => {
  state.playing = true;
  updatePlayBtn();
  elDisc.classList.add('spinning');
  renderList();
});

audio.addEventListener('pause', () => {
  state.playing = false;
  updatePlayBtn();
  elDisc.classList.remove('spinning');
  renderList();
});

audio.addEventListener('ended', () => {
  if (state.repeat === 'one'){
    audio.currentTime = 0;
    audio.play();
    return;
  }
  nextTrack(false);
});

audio.addEventListener('error', () => {
  if (state.index < 0) return;
  const f = state.files[state.index];
  setStatus(`无法播放「${f.name}」：请检查文件是否完整`, true);
});

/* 键盘快捷键 */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;

  if (e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  else if (e.code === 'ArrowRight'){ e.preventDefault(); nextTrack(true); }
  else if (e.code === 'ArrowLeft'){ e.preventDefault(); prevTrack(); }
});

/* =========================================================
   ⑦ 启动
   ========================================================= */
(async function init(){
  // 恢复音量
  const savedVol = parseFloat(localStorage.getItem('mp_volume'));
  if (!isNaN(savedVol) && savedVol >= 0 && savedVol <= 1) audio.volume = savedVol;
  elVol.value = audio.volume;
  updateVolIcon();
  elProg.style.setProperty('--p', '0%');
  elVol.style.setProperty('--p', (audio.volume * 100) + '%');
  syncRepeatUI();
  updatePlayBtn();

  setStatus('正在加载音频列表…');

  try{
    const files = await collectFiles();
    state.files = files;
    elCount.textContent = `（${files.length}）`;
    setStatus('');
    renderList();
  }catch(err){
    console.error(err);
    setStatus('⚠️ ' + err.message, true);
    elList.innerHTML = '';
  }
})();
</script>
</body>
</html>
